name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must be a semantic version such as v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi
          version_without_build="${TAG#v}"
          version_without_build="${version_without_build%%+*}"
          if [[ "$version_without_build" == *-* ]]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: validate-tag
    uses: ./.github/workflows/check.yml

  release:
    needs: [validate-tag, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
      - name: build archives
        shell: bash
        run: |
          set -euo pipefail
          version="$GITHUB_REF_NAME"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            name="vueling_${version}_${goos}_${goarch}"
            bin="vueling"
            if [ "$goos" = windows ]; then bin="vueling.exe"; fi
            mkdir -p "dist/$name"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build \
              -trimpath -ldflags "-s -w -X main.version=${version#v}" -o "dist/$name/$bin" ./cmd/vueling
            cp README.md LICENSE "dist/$name/"
            if [ "$goos" = windows ]; then
              (cd dist && zip -qr "$name.zip" "$name")
            else
              tar -C dist -czf "dist/$name.tar.gz" "$name"
            fi
            rm -rf "dist/$name"
          done
          (cd dist && sha256sum -- *.tar.gz *.zip > SHA256SUMS)
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.validate-tag.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--verify-tag --generate-notes --title "$TAG")
          if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease); fi
          gh release create "$TAG" dist/* "${args[@]}"
